img_model:
  name: "ImgCond"
  arch: "DPP_Spatial_with_CA"
  image_size: 128
  in_image: ['raw']
  in_channels: 3
  num_channels: 128
  out_channels: 3
  hadamart_prep: "Tanh"
  use_scale_shift_norm: True
  # For Cross-Attention
  num_heads: 8
  attention_resolutions: "4,2,1"
  # For Cross-Attention

img_cond_model:
  apply: False 
  arch: "EncoderSpatial_with_CA"
  in_image: ['deca_masked_face_images_woclip', 'shadow_diff_with_weight_simplified', 'face_structure']
  in_channels: 5
  image_size: 128
  out_channels: 128
  num_channels: 128
  condition_dim: 256
  override_cond: "spatial_latent"
  prep_image: [Null, Null, Null]
  noise_dpm_cond_img: [Null, Null, Null]
  canny_thres: [Null, Null, Null]
  # For Cross-Attention
  num_heads: 8
  attention_resolutions: "4,2,1"
  # For Cross-Attention

param_model:
  params_selector: ['shape', 'pose', 'exp', 'cam', 'faceemb']

relighting:
  use_SH: False

conditioning:
  face_structure:
    parts: ['hair', 'faceskin', 'eyes', 'pupils', 'glasses', 'ears', 'nose', 'inmouth', 'u_lip', 'l_lip', 'neck', 'cloth', 'hat', 'bg']

train:
  weight_decay: 0.0
  sampling_interval: 100000
  save_interval: 50000
  use_prep_data: False
  lr: 1e-4

dataset:
  deca_dir: "/data/mint/DPM_Dataset/ffhq_256_with_anno/params/"
  data_dir: "/data/mint/DPM_Dataset/ffhq_256_with_anno/ffhq_256/"
  face_segment_dir: "/data/mint/DPM_Dataset/ffhq_256_with_anno/face_segment_with_pupil/"
  deca_rendered_dir: "/data/mint/DPM_Dataset/ffhq_256_with_anno/rendered_images/"
  shadow_diff_dir: "/data/mint/DPM_Dataset/ffhq_256_with_anno/shadow_diff_SS_with_c_simplified/"

train_misc:
  exp_name: "ControlNet"
  cfg_name: "DPP_Spatial_with_CA"