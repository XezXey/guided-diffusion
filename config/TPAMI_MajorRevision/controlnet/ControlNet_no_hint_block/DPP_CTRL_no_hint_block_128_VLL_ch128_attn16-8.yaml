img_model:
  name: "ImgCond"
  arch: "ControlledUnetModel_no_hint_block"
  image_size: 128
  in_image: ['raw']
  num_res_blocks: 2
  in_channels: 3
  num_channels: 128 # Similar to model_channels in cldm_v15.yaml
  out_channels: 3
  conditioning: True  # Conditioning with DECA
  condition_proj_dim: 512
  # Cross-attention
  num_heads: 8
  attention_resolutions: "16,8"
  # Cross-attention

img_cond_model:
  apply: False 
  arch: "ControlNet_no_hint_block"
  in_image: ['deca_masked_face_images_woclip', 'shadow_diff_with_weight_simplified', 'face_structure']
  in_channels: 5
  image_size: 128
  num_heads: 8
  num_res_blocks: 2
  num_channels: 128
  out_channels: 128
  condition_dim: 256
  override_cond: "spatial_latent"
  prep_image: [Null, Null, Null]
  noise_dpm_cond_img: [Null, Null, Null]
  canny_thres: [Null, Null, Null]
  attention_resolutions: "16,8"

param_model:
  params_selector: ['shape', 'pose', 'exp', 'cam', 'faceemb']

relighting:
  use_SH: False

conditioning:
  face_structure:
    parts: ['hair', 'faceskin', 'eyes', 'pupils', 'glasses', 'ears', 'nose', 'inmouth', 'u_lip', 'l_lip', 'neck', 'cloth', 'hat', 'bg']

train:
  weight_decay: 0.0
  sampling_interval: 50000
  save_interval: 25000
  use_prep_data: False
  lr: 1e-4

dataset:
  deca_dir: "/data/mint/DPM_Dataset/ffhq_256_with_anno/params/"
  data_dir: "/data/mint/DPM_Dataset/ffhq_256_with_anno/ffhq_256/"
  face_segment_dir: "/data/mint/DPM_Dataset/ffhq_256_with_anno/face_segment_with_pupil/"
  deca_rendered_dir: "/data/mint/DPM_Dataset/ffhq_256_with_anno/rendered_images/"
  shadow_diff_dir: "/data/mint/DPM_Dataset/ffhq_256_with_anno/shadow_diff_SS_with_c_simplified/"

train_misc:
  exp_name: "ControlNet"
  cfg_name: "DPP_CTRL_no_hint_block_128_VLL_ch128_attn16-8"